<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" fill="none">
  <defs>
    <!-- Background Gradient -->
    <radialGradient id="bgGrad" cx="50%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#030712" />
    </radialGradient>

    <!-- Neon Cyan Glow Filters -->
    <filter id="cyanGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <!-- Neon Red Glow Filters -->
    <filter id="redGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="10" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <!-- Linear Gradients -->
    <linearGradient id="cyanStroke" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#67e8f9" />
      <stop offset="50%" stop-color="#22d3ee" />
      <stop offset="100%" stop-color="#06b6d4" />
    </linearGradient>

    <linearGradient id="redStroke" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#fb7185" />
      <stop offset="50%" stop-color="#f43f5e" />
      <stop offset="100%" stop-color="#ff0055" />
    </linearGradient>

    <linearGradient id="spadeGrad" x1="50%" y1="0%" x2="50%" y2="100%">
      <stop offset="0%" stop-color="#3b82f6" />
      <stop offset="60%" stop-color="#1d4ed8" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>
  </defs>

  <!-- Squircle Base / Container -->
  <rect width="512" height="512" rx="120" fill="url(#bgGrad)" stroke="#06b6d4" stroke-width="8" stroke-opacity="0.5" />

  <!-- Inner Ambient Glow -->
  <circle cx="256" cy="270" r="160" fill="#06b6d4" opacity="0.12" />

  <!-- 1. HIGH-CONTRAST SPADE (Inside the flask) -->
  <g transform="translate(256, 305) scale(1.08)">
    <path
      d="M0 -115 C45 -65 100 -25 100 32 C100 70 72 98 35 98 C12 98 0 84 0 75 C0 84 -12 98 -35 98 C-72 98 -100 70 -100 32 C-100 -25 -45 -65 0 -115 Z"
      fill="url(#spadeGrad)"
      stroke="#60a5fa"
      stroke-width="5"
      opacity="0.95"
    />
    <path
      d="M-14 70 C-10 100 -30 118 -36 124 L36 124 C30 118 10 100 14 70 Z"
      fill="url(#spadeGrad)"
      stroke="#60a5fa"
      stroke-width="4"
    />
  </g>

  <!-- 2. FLASK (Electric Neon Cyan Outline) -->
  <g filter="url(#cyanGlow)">
    <path
      d="M 190 85 C 185 85 180 89 180 94 C 180 99 185 103 190 103 L 322 103 C 327 103 332 99 332 94 C 332 89 327 85 322 85 Z"
      fill="none"
      stroke="url(#cyanStroke)"
      stroke-width="18"
      stroke-linecap="round"
      stroke-linejoin="round"
    />
    <path
      d="M 204 103
         L 204 175
         C 204 190 196 205 186 218
         L 112 342
         C 94 372 114 410 148 410
         L 364 410
         C 398 410 418 372 400 342
         L 326 218
         C 316 205 308 190 308 175
         L 308 103"
      fill="none"
      stroke="url(#cyanStroke)"
      stroke-width="20"
      stroke-linecap="round"
      stroke-linejoin="round"
    />
  </g>

  <!-- 3. PROFIT / WINRATE ASCENDING ARROW (Vibrant Neon Red / Coral) -->
  <g filter="url(#redGlow)">
    <path
      d="M 115 372 L 216 264 L 254 310 L 388 172"
      fill="none"
      stroke="url(#redStroke)"
      stroke-width="24"
      stroke-linecap="round"
      stroke-linejoin="round"
    />
    <path
      d="M 338 172 L 412 150 L 392 224 L 372 202 L 354 214 L 344 200 L 362 188 Z"
      fill="url(#redStroke)"
      stroke="url(#redStroke)"
      stroke-width="4"
      stroke-linejoin="round"
    />
  </g>
</svg>